# 운영 배포: 서버 1대(Ubuntu x86, 16GB)에서 전체 서비스를 띄운다. 사용법은 deploy/README.md.
# hanstep-AI 레포의 ai/(ai-server·ai-worker)와 ocr/(ocr-worker)도 여기서 빌드한다.
# 실행(hanstep-backend 루트에서): docker compose -f deploy/compose.prod.yml up -d --build
# 상대 경로는 이 파일이 있는 deploy/ 기준. 비밀값은 deploy/.env(커밋 안 함, 예시는 deploy/.env.example).
# 호스트에 여는 포트는 caddy 80·443 뿐이고, 나머지는 내부 네트워크에서 서비스 이름으로 통신한다.
# 로컬 개발용 compose 는 루트의 docker-compose.yml(이 파일과 별개).
#
# mem_limit: 서버 실측 후 정함. 로컬 실측은 deploy/README.md "측정 기록" 표 참고.
name: hanstep

# ai-server 와 ai-worker 가 같은 값으로 쓰는 환경 변수. 각 서비스는 <<: *x-ai-base-env 로 받고 자기 것만 더한다.
x-ai-base-env: &x-ai-base-env
  # 비밀번호는 URI 에 그대로 들어가므로 영문·숫자로 만든다(특수문자는 퍼센트 인코딩 필요)
  MONGO_URI: mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&directConnection=true
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
  # 팀 공통 고정값(hanstep-AI ai/.env.example 과 같음). 바꾸면 저장된 청크를 전부 다시 임베딩해야 한다
  EMBEDDING_MODEL_REVISION: 5617a9f61b028005a4858fdac845db406aefb181
  # AI → Spring 내부 API. 키는 Spring 의 SPRING_INTERNAL_API_KEY 와 같은 값(같은 변수를 양쪽에 넣음)
  SPRING_INTERNAL_API_URL: http://spring:8080
  SPRING_INTERNAL_API_KEY: ${SPRING_INTERNAL_API_KEY}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
  R2_REGION: ${R2_REGION:-auto}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
  R2_POLICY_BUCKET: ${R2_POLICY_BUCKET:-hanstep-visa-policies}
  R2_POLICY_PREFIX: ${R2_POLICY_PREFIX:-policy-sources}
  # 외국인등록증 버킷 이름(비밀 아님). 정책·상품 버킷이 이 버킷이면 AI 가 거부한다(빠지면 이 확인이 꺼짐)
  R2_ARC_BUCKET: ${R2_ARC_BUCKET:-hanstep-arc-private}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      # 볼륨이 비어 있는 최초 기동 때만 스키마 → 기준 시드 → 데모 시드 순으로 실행된다.
      # 로컬 전용 시드(db/dev, Mock 환율)는 마운트하지 않는다(운영 환율은 실데이터만, #119)
      - ../db/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    # $$ 는 컨테이너 안 환경 변수(compose 설정에 비밀번호를 펼치지 않음)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # mem_limit: 서버 실측 후 정함

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    # mem_limit: 서버 실측 후 정함

  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-search:/data/mongot
    # healthcheck 는 이미지 기본값 사용
    # mem_limit: 서버 실측 후 정함

  spring:
    build:
      context: ..
    image: hanstep-backend:prod
    restart: unless-stopped
    environment:
      # 임시값, 서버 실측 후 조정
      JAVA_OPTS: ${SPRING_JAVA_OPTS:--Xmx768m}
      # application-prod.yaml: 프록시 헤더(https) 인식, API 문서는 /api/v1 만
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      SPRING_INTERNAL_API_KEY: ${SPRING_INTERNAL_API_KEY}
      AI_INTERNAL_API_URL: http://ai-server:8000
      AI_INTERNAL_API_TOKEN: ${AI_INTERNAL_API_TOKEN}
      E74_INCLUDE_DRAFT_RULES: ${E74_INCLUDE_DRAFT_RULES:-false}
      # 데모 계정 초기화(POST /api/v1/demo/reset, #131). 시연 리허설 동안만 true, 발표 뒤 false
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-false}
      # 외국인등록증 원본 업로드·확정 시 삭제(#73). 등록증 버킷 전용 쓰기·삭제 키만 준다(정책·상품 키 R2_ACCESS_KEY_ID 는 넣지 않음).
      # ocr-worker 는 이 키가 아니라 읽기 전용 키(R2_OCR_WORKER_*)를 받는다
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      R2_REGION: ${R2_REGION:-auto}
      R2_OCR_ACCESS_KEY_ID: ${R2_OCR_ACCESS_KEY_ID}
      R2_OCR_SECRET_ACCESS_KEY: ${R2_OCR_SECRET_ACCESS_KEY}
      R2_ARC_BUCKET: ${R2_ARC_BUCKET:-hanstep-arc-private}
      # 등록증 원본 보관 기한 만료 삭제(#162). 빈 값이 Spring 에 가면 꺼지거나(enabled) 기동에 실패하므로(주기) 기본값을 꼭 둔다
      ARC_ORIGINAL_EXPIRY_ENABLED: ${ARC_ORIGINAL_EXPIRY_ENABLED:-true}
      ARC_ORIGINAL_EXPIRY_INTERVAL_MS: ${ARC_ORIGINAL_EXPIRY_INTERVAL_MS:-3600000}
      ARC_ORIGINAL_EXPIRY_BATCH_SIZE: ${ARC_ORIGINAL_EXPIRY_BATCH_SIZE:-100}
      # 환율 수집기(#119). 1시간 수집은 Mock 정리 SQL·백필을 끝낸 뒤 켠다(deploy/README.md "환율 수집기")
      KOREAEXIM_API_KEY: ${KOREAEXIM_API_KEY:-}
      FX_COLLECTOR_ENABLED: ${FX_COLLECTOR_ENABLED:-false}
      FX_COLLECTOR_CURRENCIES: ${FX_COLLECTOR_CURRENCIES:-USD,PHP}
      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL:-https://api.frankfurter.dev/v2}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # mem_limit: 서버 실측 후 정함

  ai-server:
    build:
      # hanstep-AI 레포를 hanstep-backend 옆에 clone 해 둬야 한다
      context: ../../hanstep-AI/ai
    image: hanstep-ai:prod
    restart: unless-stopped
    init: true
    environment:
      <<: *x-ai-base-env
      LOAD_MODEL_ON_STARTUP: "true"
      # Spring → AI 내부 API 토큰. Spring 의 AI_INTERNAL_API_TOKEN 과 같은 값(/health/ready 의 internal_auth 가 확인)
      AI_INTERNAL_API_TOKEN: ${AI_INTERNAL_API_TOKEN}
      # 챗봇 실제 모델 호출. AI 설정 기본값이 fake 라 빠지면 가짜 답변을 낸다
      CHAT_LLM_MODE: ${CHAT_LLM_MODE:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # 챗봇 프롬프트 버전. AI 설정이 허용 값 목록(Literal)으로 검사해 빈 값이면 기동에 실패하므로 기본값을 꼭 둔다.
      # 금융 정책 RAG(search_finance_policy)는 v4.2 이상, 환율 진단 도구(fx_rate_summary)·카드는 v4.4 이상,
      # 상품 추천 카드는 v4.5 이상, 답변 표시 규칙(결론 굵게·목록)은 v4.6 이상, 비자 로드맵 도구(get_visa_roadmap)·카드는 v4.7 에서 쓴다.
      # 운영 버전은 이 기본값으로 정한다(서버 .env 에는 두지 않음). v4.7 측정은 hanstep-AI #127, FE 로드맵 카드는 hanstep-frontend #70
      CHAT_PROMPT_VERSION: ${CHAT_PROMPT_VERSION:-v4.7}
      # 금융 정책 문서 폴더(컨테이너 안 경로, 아래 볼륨). 비우면 금융 정책 검색이 SEARCH_NOT_CONFIGURED
      FINANCE_POLICY_CORPUS_DIR: ${FINANCE_POLICY_CORPUS_DIR:-}
      # 금융 정책 검색 결과에 항 단위 라벨(발행처 등)을 붙인다(AI #88 스펙 가드 ②)
      FINANCE_POLICY_LABELS: ${FINANCE_POLICY_LABELS:-false}
      R2_PRODUCT_BUCKET: ${R2_PRODUCT_BUCKET:-hanstep-financial-products}
      LAW_API_OC: ${LAW_API_OC}
      E74_INCLUDE_DRAFT_RULES: ${E74_INCLUDE_DRAFT_RULES:-false}
      # 로드맵 단계 문장을 LLM 으로 쓸지(숫자·날짜는 엔진 값 그대로). 위 ANTHROPIC_API_KEY 를 같이 쓰고, 키가 없거나 false 면 템플릿 문장.
      # 모델은 AI 기본값(ROADMAP_TEXT_MODEL 이 비면 AGENT_MODEL, claude-haiku-5-5). 켠 뒤 만든 로드맵부터 바뀐다
      ROADMAP_LLM_TEXT: ${ROADMAP_LLM_TEXT:-false}
    volumes:
      # BGE-M3 가중치(~2.3GB). 처음 한 번 받고 재빌드해도 다시 쓴다
      - hf-cache:/models/huggingface
      # RAG 적재 원문(ingest_rag_documents.py 의 manifest data_root 가 /data/rag_documents 로 풀림)
      - ../../hanstep-AI/data/rag_documents:/data/rag_documents:ro
      # 금융 정책 문서(레포 밖, 서버 ~/hanstep/rag-data/finance-policy 에 수동 배치). 컨테이너 사용자(uid 10001)가 읽을 수 있어야 한다.
      # 호스트 폴더가 없으면 Docker 가 root 소유 빈 폴더를 만들어 검색 구축이 실패하므로 먼저 만들어 둔다
      - ../../rag-data/finance-policy:/data/finance-policy:ro
      # 상품·금융 정책 검색기 임베딩 캐시. 재생성해도 남아 두 번째 기동부터 다시 계산하지 않는다(#133).
      # 이미지에 이 폴더가 uid 10001 소유로 있어야 한다(AI #98). 폴더가 없는 이미지로 먼저 붙이면 root 소유 볼륨이 남아 캐시를 쓰지 못한다
      - ai-rag-cache:/app/artifacts/rag/embedding-cache
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # healthcheck 는 이미지 기본값(/health/live) 사용
    # mem_limit: 서버 실측 후 정함

  # RabbitMQ policy.ingest 소비자(hanstep-AI #55). 정책 문서를 적재하고 INT-08·INT-10·INT-13 으로 Spring 에 보고한다.
  # 1개만 띄운다: Worker 가 여럿이면 죽지 않고 느린 Worker 를 구분하지 못한다(hanstep-AI #55 PR 본문).
  ai-worker:
    # ai-server 가 빌드한 이미지를 그대로 쓴다(build 없음)
    image: hanstep-ai:prod
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    # SIGTERM 을 받으면 RabbitMQ 연결을 닫고 종료한다
    init: true
    environment:
      <<: *x-ai-base-env
      # job_started 의 workerId. RETRY_DELAYS_MS 는 AI 기본값(5000,15000,45000)을 따른다
      WORKER_ID: ai-worker-1
    volumes:
      # ai-server 와 같은 볼륨이라 모델을 다시 받지 않는다
      - hf-cache:/models/huggingface
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # 메시지를 받자마자 job_started 를 부른다
      spring:
        condition: service_healthy
      # ai-server 다음에 띄운다. ai-server healthy(/health/live)는 모델 로드 전이라 첫 기동 때는 모델을 같이 받을 수 있다(hf-cache에 모델이 이미 있으면 다시 받지 않음)
      ai-server:
        condition: service_healthy
    # 이미지 HEALTHCHECK 는 ai-server 의 8000 포트를 본다(Worker 는 HTTP 서버 없음)
    healthcheck:
      disable: true
    # mem_limit: 서버 실측 후 정함

  # 외국인등록증 OCR 소비자(hanstep-AI ocr/worker, AI #80). Spring 이 선언한 ocr.request 큐(+ .retry·.dlq, #73)를 받아
  # R2 에서 원본을 읽고 OCR 결과를 Spring 내부 API 로 보고한다. Python 3.10 + paddle 이라 ai-server 와 이미지가 다르다(약 2.4GB).
  # 1개만 띄운다(OCR 추론이 CPU 를 많이 쓴다).
  ocr-worker:
    build:
      # hanstep-AI 레포를 hanstep-backend 옆에 clone 해 둬야 한다(ai-server 와 같음). 첫 빌드는 paddle 설치·모델 다운로드로 오래 걸린다
      context: ../../hanstep-AI/ocr
    image: hanstep-ocr:prod
    command: ["python", "-m", "worker"]
    restart: unless-stopped
    # SIGTERM 을 받으면 RabbitMQ 연결을 닫고 종료한다
    init: true
    # x-ai-base-env 를 상속하지 않고 Worker 가 읽는 것(ocr/worker/config.py)만 넣는다. 정책·상품 버킷 키(R2_ACCESS_KEY_ID)·Mongo 주소는 넣지 않는다.
    # 필수 값이 비어 있으면 Worker 가 모델을 올리기 전에 "worker not configured" 를 남기고 종료한다(다른 서비스는 그대로 뜬다)
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
      SPRING_INTERNAL_API_URL: http://spring:8080
      SPRING_INTERNAL_API_KEY: ${SPRING_INTERNAL_API_KEY}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      R2_REGION: ${R2_REGION:-auto}
      # ARC 버킷 읽기 전용 키(GET 만). spring 의 R2_OCR_*(업로드·삭제용)와 다른 키를 Worker 가 읽는 이름(R2_OCR_*)으로 넘긴다
      R2_OCR_ACCESS_KEY_ID: ${R2_OCR_WORKER_ACCESS_KEY_ID}
      R2_OCR_SECRET_ACCESS_KEY: ${R2_OCR_WORKER_SECRET_ACCESS_KEY}
      R2_ARC_BUCKET: ${R2_ARC_BUCKET:-hanstep-arc-private}
      # job_started 의 workerId. RETRY_DELAYS_MS 는 Worker 기본값(5000,15000,45000)을 따른다
      WORKER_ID: ocr-worker-1
      # PaddleOCR 스레드 수. 아래 cpus 상한과 같은 값으로 맞춘다(다르면 스레드 경쟁으로 느려짐, hanstep-AI PR #113 측정)
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-2}
    depends_on:
      rabbitmq:
        condition: service_healthy
      # 메시지를 받자마자 job_started 를 부르고, 원본 조회·결과 보고도 Spring 내부 API 로 한다
      spring:
        condition: service_healthy
    # HTTP 서버가 없다
    healthcheck:
      disable: true
    # 11/20 운영 측정으로 2 유지 결정(OCR_CPU_THREADS와 같이 바꿀 것), OCR 처리 시간과 챗봇 응답 사이 균형(로컬 측정에서 OCR 추론이 CPU 8코어를 모두 썼다)
    cpus: "2"
    # mem_limit: 서버 실측 후 정함

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Swagger UI 기본 인증. 비어 있으면 Caddyfile 을 읽지 못해 Caddy 전체(/api/v1 포함)가 멈추므로, 그 전에 compose 가 오류를 낸다
      SWAGGER_BASIC_USER: ${SWAGGER_BASIC_USER:?deploy/.env 에 SWAGGER_BASIC_USER 를 넣어야 한다}
      SWAGGER_BASIC_HASH: ${SWAGGER_BASIC_HASH:?deploy/.env 에 SWAGGER_BASIC_HASH 를 넣어야 한다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 보관(지우면 재발급, 발급 횟수 제한에 걸릴 수 있음)
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      spring:
        condition: service_healthy
    # mem_limit: 서버 실측 후 정함

volumes:
  mysql-data:
  rabbitmq-data:
  mongo-data:
  mongo-config:
  mongo-search:
  hf-cache:
  ai-rag-cache:
  caddy-data:
  caddy-config:
