services:
  mysql:
    image: mysql:8.4
    container_name: hanstep-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    # 최초 기동 땐 db/init 실행이 끝나야 TCP 접속이 열린다. $$ 는 컨테이너 안 환경 변수(compose 설정에 비밀번호를 펼치지 않음)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: hanstep-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: hanstep-mongodb
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_USER:?Set MONGODB_USER in .env}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-search:/data/mongot
    # healthcheck 는 이미지 기본값 사용

# AI 레포 compose는 이 네트워크에 external로 참여해 mongodb:27017, rabbitmq:5672로 접속함.
networks:
  default:
    name: hanstep-net

volumes:
  mysql-data:
  rabbitmq-data:
  mongo-data:
  mongo-config:
  mongo-search:
