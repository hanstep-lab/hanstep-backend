spring:
  application:
    name: hanstep-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hanstep}?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

hanstep:
  jwt:
    secret: ${JWT_SECRET}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:3600}
  internal:
    api-key: ${SPRING_INTERNAL_API_KEY:}
  ai:
    base-url: ${AI_INTERNAL_API_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_API_TOKEN:}
    connect-timeout: 3s
    read-timeout: 30s

logging:
    pattern:
      level: "%5p [%X{requestId:-}]"