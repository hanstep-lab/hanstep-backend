spring:
  application:
    name: hanstep-backend
  config:
    import: optional:file:.env[.properties]
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hanstep}?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

hanstep:
  ai-jobs:
    confirm-timeout: 5s
  jwt:
    secret: ${JWT_SECRET}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:3600}
  internal:
    api-key: ${SPRING_INTERNAL_API_KEY:}
  ai:
    base-url: ${AI_INTERNAL_API_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_API_TOKEN:}
    connect-timeout: 3s
    read-timeout: 30s
    # 챗봇 스트림(INT-05) 답변 1개의 전체 시간 제한. JDK read-timeout 은 응답 전체에 걸린다
    stream-read-timeout: 90s
  chat:
    # CHT-04 스트림 중계 실행기: virtual(가상 스레드, 기본) | platform(고정 풀, 큐 제한 없음)
    # 고정 풀은 크기만큼만 동시에 AI 를 읽고 나머지는 큐에서 기다린다(ChatStreamConcurrencyPerfTest)
    stream-executor: virtual
    # platform 일 때만 쓰는 고정 풀 크기
    stream-pool-size: 16
  e74:
    # 승인 전(DRAFT) 규칙 버전으로 계산한 결과도 저장할지. AI 서버 .env 와 같은 값. 운영은 false, 로컬·시연에서만 true
    include-draft-rules: ${E74_INCLUDE_DRAFT_RULES:false}

logging:
    pattern:
      level: "%5p [%X{requestId:-}]"
