spring:
  application:
    name: hanstep-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hanstep}?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

hanstep:
  jwt:
    secret: ${JWT_SECRET}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:3600}
  internal:
    api-key: ${SPRING_INTERNAL_API_KEY:}
  ai:
    base-url: ${AI_INTERNAL_API_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_API_TOKEN:}
    connect-timeout: 3s
    read-timeout: 30s
    # 챗봇 스트림(INT-05) 답변 1개의 전체 시간 제한. JDK read-timeout 은 응답 전체에 걸린다
    stream-read-timeout: 90s
  chat:
    # CHT-04 스트림 중계 실행기: platform(고정 풀, 큐 제한 없음) | virtual(가상 스레드). 동시 연결 측정 결과로 결정
    stream-executor: platform
    stream-pool-size: 16

logging:
    pattern:
      level: "%5p [%X{requestId:-}]"