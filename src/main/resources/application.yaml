spring:
  application:
    name: hanstep-backend
  config:
    import: optional:file:.env[.properties]
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hanstep}?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # 등록증 앞면 업로드(DOC-01). FE 가 4000px 이하로 줄여 올린다. DocumentService.MAX_BYTES 와 같은 값
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  tomcat:
    # 업로드 크기 제한(10MB)으로 거절한 요청의 남은 본문을 이만큼까지 읽어 버리고 400 을 보낸다. 기본 2MB 면 10MB 를 조금
    # 넘는 본문도 응답 전에 연결을 끊어 클라이언트가 400 대신 네트워크 오류를 받는다(#73 업로드 측정). 이보다 큰 본문은 끊는다
    max-swallow-size: 20MB

hanstep:
  ai-jobs:
    confirm-timeout: 5s
    # 발행 대기 작업(PENDING·NOT_PUBLISHED/PUBLISH_FAILED) 주기 재발행(U2). 테스트는 build.gradle 에서 끈다
    republish:
      enabled: ${AI_JOB_REPUBLISH_ENABLED:true}
      interval-ms: 60000
      initial-delay-ms: 60000
      min-idle-seconds: 30
      batch-size: 100
  # 외국인등록증 원본(R2 hanstep-arc-private). 등록증 버킷 전용 키(R2_OCR_*)를 쓴다(정책·상품 키 R2_ACCESS_KEY_ID 아님)
  arc-storage:
    endpoint: ${R2_ENDPOINT_URL:}
    region: ${R2_REGION:auto}
    access-key-id: ${R2_OCR_ACCESS_KEY_ID:}
    secret-access-key: ${R2_OCR_SECRET_ACCESS_KEY:}
    bucket: ${R2_ARC_BUCKET:}
  jwt:
    secret: ${JWT_SECRET}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:3600}
  internal:
    api-key: ${SPRING_INTERNAL_API_KEY:}
  ai:
    base-url: ${AI_INTERNAL_API_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_API_TOKEN:}
    connect-timeout: 3s
    read-timeout: 30s
    # 챗봇 스트림(INT-05) 답변 1개의 전체 시간 제한. JDK read-timeout 은 응답 전체에 걸린다
    stream-read-timeout: 90s
  chat:
    # CHT-04 스트림 중계 실행기: virtual(가상 스레드, 기본) | platform(고정 풀, 큐 제한 없음)
    # 고정 풀은 크기만큼만 동시에 AI 를 읽고 나머지는 큐에서 기다린다(ChatStreamConcurrencyPerfTest)
    stream-executor: virtual
    # platform 일 때만 쓰는 고정 풀 크기
    stream-pool-size: 16
  e74:
    # 승인 전(DRAFT) 규칙 버전으로 계산한 결과도 저장할지. AI 서버 .env 와 같은 값. 운영은 false, 로컬·시연에서만 true
    include-draft-rules: ${E74_INCLUDE_DRAFT_RULES:false}
  # 환율 수집기(#119). 외부 환율 API 를 부르는 곳은 이 수집기뿐이다(화면·챗봇은 exchange_rates 만 읽음). 실데이터만 저장한다
  fx-collector:
    # 1시간 주기 수집. 꺼져 있어도 백필(POST /internal/v1/fx/backfill)은 된다. 테스트는 기본값(false) 그대로
    enabled: ${FX_COLLECTOR_ENABLED:false}
    interval-ms: 3600000
    initial-delay-ms: 60000
    # 수집할 통화(쉼표). PHP 는 Frankfurter(ECB), 나머지는 수출입은행 고시 통화(23개)만. 비우면 USD,PHP
    currencies: ${FX_COLLECTOR_CURRENCIES:USD,PHP}
    connect-timeout: 3s
    read-timeout: 10s
    koreaexim:
      base-url: https://oapi.koreaexim.go.kr
      # 한국수출입은행 현재환율 Open API 인증키. 코드·문서·로그에 쓰지 않는다(요청 URL 은 로그에 남기지 않고, 오류 문구는 가림)
      api-key: ${KOREAEXIM_API_KEY:}
    frankfurter:
      # 비우면 https://api.frankfurter.dev/v2
      base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev/v2}
    backfill:
      # from 을 안 주면 오늘(KST)부터 이만큼 거슬러 올라간다
      months: 12
      # 수출입은행 1회 실행 호출 상한. 한도는 1000회/일로 알려져 있으나 미확인이라 400 으로 나눠 돌릴 수 있게 둔다
      max-calls: 400
      call-interval: 300ms
  # 해외송금 견적(TRF-02·INT-18, #121). 신한 SOL 해외송금 공시값. 코드에 두지 않고 여기서만 고친다. 값마다 출처·확인일을 둔다.
  # 견적은 추정이다(isEstimated=true). 송금 통화는 USD(필리핀을 골라도 신한 SOL 송금 통화에 PHP 가 없음)
  remittance:
    # 신한 USD 송금 스프레드(%). 매매기준율 대비 보내실 때 환율의 차이. 1,344.20 / 1,331.50 - 1 = 0.954%
    usd-spread-pct: 0.954
    usd-spread-source:
      title: "신한은행 국제환율 고시표 2026-11-18 09:07 11회차(매매기준율 1,331.50 / 보내실 때 1,344.20)"
      checked-on: 2026-11-18
    # 수취 국가(사용자 국적 visa_profiles.nationality_code) → PHP 참고 환율을 붙일 국가. 지금은 필리핀만
    php-reference-nationalities: [PHL]
    # 모든 상품에 붙는 안내(거래외국환은행 지정 08, 여권, 연간 미화 5만불)
    common-notices: [FOREIGN_EXCHANGE_BANK_DESIGNATION_REQUIRED]
    sol-easy:
      # 송금수수료·전신료는 이벤트 조건(종료일 미공시, 2023년 3월부터 같은 조건). 종료 후 값(전신료 8,000원,
      # 송금수수료 영업점 50% 우대 2,500~12,500원)은 영업점 수수료표가 없어 계산할 수 없다. false 면 견적을 내지 않고
      # FEE_TABLE_UNAVAILABLE
      event-active: true
      fee-threshold-usd: 5000
      send-fee-at-or-below-krw: 0
      send-fee-above-krw: 10000
      telegraphic-fee-krw: 5000
      # 환율 우대(3·6·9). 과거 1년 송금 횟수(신청 건 포함, 이번 건 포함) 이상이면 그 우대율(%)을 스프레드에 적용
      preferential-tiers:
        - { min-count: 1, pct: 50 }
        - { min-count: 3, pct: 60 }
        - { min-count: 6, pct: 65 }
        - { min-count: 9, pct: 70 }
      delivery-type: SWIFT_ACCOUNT
      notices: [INTERMEDIARY_FEE_MAY_APPLY]
      source:
        title: "신한 SOL 쏠편한 해외송금 안내"
        approval-no: "준법감시인 사전심사필 제2026-14794-1호(2026.09.16~2027.09.15)"
        checked-on: 2026-11-18
    sol-fast:
      # 송금수수료 USD(송금액·방법 무관, 수취인 별도 수수료 없음). 약관 제9조대로 송금액에 더해 출금. 환율 우대 없음
      fee-usd: 3.5
      # 건당 한도. 넘으면 LIMIT_EXCEEDED. 1일 한도(USD 10,000)는 오늘 보낸 USD 를 알 수 없어(Mock 이력은 원화) 보지 않는다
      per-transfer-limit-usd: 5000
      # 웨스턴유니온 캐시픽업(수분) 또는 계좌(1~2영업일)
      delivery-type: WESTERN_UNION
      notices: [LOCAL_PAYOUT_RATE_BY_AGENT]
      source:
        title: "신한 쏠빠른 해외송금 상품설명서·거래약관(제9조)"
        approval-no: "준법감시인 사전심사필 제2026-12828-2호(2026.06.17~2027.06.16)"
        checked-on: 2026-11-18

logging:
    pattern:
      level: "%5p [%X{requestId:-}]"
