plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hanstep'
version = '0.0.1-SNAPSHOT'
description = 'hanstep-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // 등록증 원본 R2(S3 호환) 업로드·삭제(#73). 기준선 시제품에서 쓰던 것을 main 으로 옮김
    implementation platform('software.amazon.awssdk:bom:2.59.1')
    implementation 'software.amazon.awssdk:s3'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // AI 작업 발행 테스트용 RabbitMQ(Docker 필요). compose 의 브로커에 테스트 메시지를 넣지 않으려고 따로 띄운다
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'perf'
    }
    // 발행 대기 작업 주기 재발행(U2)을 끈다. 켜 두면 테스트 중 공용 DB 의 대기 작업을 .env 의 로컬 브로커로 보낸다
    systemProperty 'hanstep.ai-jobs.republish.enabled', 'false'
    // 등록증 원본 만료 삭제(#162)를 끈다. 켜 두면 공용 DB 의 기한 지난 문서 원본을 .env 의 R2 에서 지운다(테스트는 직접 부른다)
    systemProperty 'hanstep.arc-original-expiry.enabled', 'false'
    // 테스트 컨텍스트마다 Hikari 가 처음부터 연결 10개를 잡아 캐시된 컨텍스트가 늘면 공용 MySQL 이 "Too many connections".
    // 최소 유휴만 줄인다(최대 풀 10 은 그대로라 동시성 테스트는 그대로). perfTest 에는 넣지 않는다(측정 조건 유지)
    systemProperty 'spring.datasource.hikari.minimum-idle', '1'
    systemProperty 'spring.datasource.hikari.idle-timeout', '10000'
}

// 적재 기준선 측정(@Tag("perf")). Docker MySQL(3307)이 떠 있어야 함: ./gradlew perfTest
tasks.register('perfTest', Test) {
    description = 'Runs @Tag("perf") baseline measurements against the local Docker MySQL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'perf'
    }
    outputs.upToDateWhen { false }
    systemProperty 'hanstep.ai-jobs.republish.enabled', 'false'
    systemProperty 'hanstep.arc-original-expiry.enabled', 'false'
    testLogging {
        showStandardStreams = true
    }
}
